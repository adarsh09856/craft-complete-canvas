version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: goldentakin_postgres
    restart: always
    environment:
      POSTGRES_USER: takin_admin
      POSTGRES_PASSWORD: takin_secure_pass_2026
      POSTGRES_DB: goldentakin_travel
    ports:
      - "5432:5432"
    volumes:
      - takin_pgdata:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - ./seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U takin_admin -d goldentakin_travel"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  takin_pgdata:
    driver: local
